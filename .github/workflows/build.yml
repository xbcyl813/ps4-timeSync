name: Build ps4-timeSync PKG

on:
  push:
    branches: [ pkg ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 2. 校验自定义图标文件
        run: |
          if [ ! -f "sce_sys/icon0.png" ]; then
            echo "::error::缺少 sce_sys/icon0.png 图标文件！"
            exit 1
          fi

      - name: 3. 下载官方完整版 OpenOrbis Toolchain Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ${{ github.workspace }}/oo_toolchain /tmp/oo_dl
          gh release download -R OpenOrbis/OpenOrbis-PS4-Toolchain -p "*linux*" -D /tmp/oo_dl || gh release download -R OpenOrbis/OpenOrbis-PS4-Toolchain -p "*" -D /tmp/oo_dl
          tar -xzf /tmp/oo_dl/*.tar.gz -C ${{ github.workspace }}/oo_toolchain

          # 自动查找 create-fself 所在的真实工具链根目录
          CREATE_FSELF_PATH=$(find ${{ github.workspace }}/oo_toolchain -name "create-fself" -type f | head -n 1)
          echo "Found create-fself at: $CREATE_FSELF_PATH"
          REAL_OO_DIR=$(dirname $(dirname $(dirname "$CREATE_FSELF_PATH")))
          echo "OO_PS4_TOOLCHAIN=$REAL_OO_DIR" >> $GITHUB_ENV
          chmod +x $(dirname "$CREATE_FSELF_PATH")/*

      - name: 4. 安装编译与打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl perl
          # 从 OpenSSL 官方 GitHub Release 编译安装 libssl1.1（永久有效，不依赖 Ubuntu 旧源）
          curl -fSL https://github.com -o /tmp/openssl.tar.gz
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          cd /tmp/openssl-1.1.1w
          ./config --prefix=/usr/local/ssl --openssldir=/usr/local/ssl shared zlib-dynamic || ./config --prefix=/usr/local/ssl shared
          make -j$(nproc) build_libs
          sudo cp libssl.so.1.1 libcrypto.so.1.1 /usr/lib/x86_64-linux-gnu/
          sudo ldconfig
          
      - name: 5. 编译并打包生成 ps4-timeSync.pkg
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
        run: |
          make

      - name: 6. 上传 ps4-timeSync.pkg 产物
        uses: actions/upload-artifact@v4
        with:
          name: ps4-timeSync-pkg
          path: ps4-timeSync.pkg
          if-no-files-found: error
