name: Build ps4-timeSync Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 2. 拉取 GoldHEN Plugins SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: goldhen_sdk

      - name: 3. 下载官方完整版 OpenOrbis Toolchain Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ${{ github.workspace }}/oo_toolchain /tmp/oo_dl
          gh release download -R OpenOrbis/OpenOrbis-PS4-Toolchain -D /tmp/oo_dl
          ls -la /tmp/oo_dl
          if ls /tmp/oo_dl/*.tar.gz 1> /dev/null 2>&1; then
            tar -xzf /tmp/oo_dl/*.tar.gz -C ${{ github.workspace }}/oo_toolchain
          elif ls /tmp/oo_dl/*.zip 1> /dev/null 2>&1; then
            unzip -q /tmp/oo_dl/*.zip -d ${{ github.workspace }}/oo_toolchain
          fi
          chmod +x ${{ github.workspace }}/oo_toolchain/bin/linux/*

      - name: 4. 安装编译依赖并构建 GoldHEN SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make
          make -C ${{ github.workspace }}/goldhen_sdk OO_PS4_TOOLCHAIN=${{ github.workspace }}/oo_toolchain

      - name: 5. 编译生成 ps4-timeSync.prx 插件
        env:
          OO_PS4_TOOLCHAIN: ${{ github.workspace }}/oo_toolchain
          GOLDHEN_PLUGINS_SDK: ${{ github.workspace }}/goldhen_sdk
        run: |
          make

      - name: 6. 上传 ps4-timeSync.prx 产物
        uses: actions/upload-artifact@v4
        with:
          name: ps4-timeSync-plugin
          path: ps4-timeSync.prx
