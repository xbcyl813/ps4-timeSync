name: Build PS4 PKG

on:
  push:
    branches:
      - pkg
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make wget tar dotnet-runtime-6.0 || sudo apt-get install -y clang lld llvm make wget tar dotnet-runtime-8.0

      - name: Setup OpenOrbis PS4 Toolchain
        run: |
          mkdir -p oo_toolchain
          wget -q https://github.com -O toolchain.tar.gz
          tar -xzf toolchain.tar.gz -C oo_toolchain
          chmod +x oo_toolchain/OpenOrbis/PS4Toolchain/bin/linux/*

      - name: Verify custom icon
        run: |
          if [ ! -f "sce_sys/icon0.png" ]; then
            echo "::error::Missing sce_sys/icon0.png! Please upload your custom 512x512 PNG icon."
            exit 1
          fi

      - name: Build PKG
        env:
          OO_PS4_TOOLCHAIN: ${{ github.workspace }}/oo_toolchain/OpenOrbis/PS4Toolchain
        run: make

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-timeSync-pkg
          path: ps4-timeSync.pkg
          if-no-files-found: error
