name: Build GoldHEN NTP Sync Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 2. 拉取 OpenOrbis Toolchain
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          path: oo_toolchain

      - name: 3. 拉取 GoldHEN Plugins SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: goldhen_sdk

      - name: 4. 安装 Clang 与 LLD 工具链并编译 SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make
          chmod +x ${{ github.workspace }}/oo_toolchain/bin/linux/*
          make -C ${{ github.workspace }}/goldhen_sdk OO_PS4_TOOLCHAIN=${{ github.workspace }}/oo_toolchain

      - name: 5. 编译生成 ntp_sync.prx 插件
        env:
          OO_PS4_TOOLCHAIN: ${{ github.workspace }}/oo_toolchain
          GOLDHEN_PLUGINS_SDK: ${{ github.workspace }}/goldhen_sdk
        run: |
          make

      - name: 6. 上传 ntp_sync.prx 产物
        uses: actions/upload-artifact@v4
        with:
          name: ntp_sync-goldhen-plugin
          path: ntp_sync.prx
