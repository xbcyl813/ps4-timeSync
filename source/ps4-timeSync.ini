; ps4-timeSync 配置文件
; 路径: /data/GoldHEN/ps4-timeSync.ini

[General]
; 插件加载后等待联网的秒数（手动注入破解可设为 0~2，自动注入建议 5~8）
DelaySeconds=5

; 网络未就绪时的最大重试次数（每次间隔 3 秒）
MaxRetries=6

; 弹窗提示模式: 0 = 完全静默, 1 = 仅失败时提示, 2 = 成功和失败均提示
NotifyMode=2

[NTP]
; 自定义 NTP 服务器 IP（支持最多 4 个，留空则跳过）
Server1=203.107.6.88
Server2=119.29.26.206
Server3=120.25.115.20
Server4=182.92.12.11
